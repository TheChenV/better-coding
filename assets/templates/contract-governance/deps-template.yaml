# deps.yaml 标准模板（契约登记单：provides = 本模块对外声明的接口，consumes = 本模块锁定的上游接口）
# 使用说明：复制此模板到 server/<module>/deps.yaml 或 web/<module>/deps.yaml，
# 填充实际的 provides/consumes 信息；版本号一律 semver（major 变更 = 破坏性，检测器据此阻断构建）。
# 谁来读它：.qoder/scripts/contract-drift.mjs（环节 3 末登记、环节 6 联调前校验）。

metadata:
  module_name: "<module-name>"
  module_path: "<server|web>/<module-name>"
  role: "<provider|consumer>"
  created_date: "<YYYY-MM-DD>"

# provider 侧自检提示：contract_file 填了，检测器会把 api_version 与该契约的 info.version 对账；
# 留 null 则这一项无从自检，报告会以 provides_unverified 把盲区显式记出来（不再被当成"都验过了"）。
provides:
  - name: "<API名称>"
    api_version: "<semver>"
    contract_file: "<相对于项目根目录的 API 契约 YAML 路径，无则为 null>"
    base_path: "<API 基础路径>"
    operations:
      - "<operationId_1>"
      - "<operationId_2>"

consumes:
  - provider: "<依赖的服务名>"
    contract_file: "<Provider 的 API 契约 YAML 路径，外部服务为 null>"
    pinned_version: "<锁定的 Provider API 版本号，登记时逐字取 Provider 契约的 info.version>"
    dependency_type: "<rest_api|event_consumer|event_publisher|external>"
    operations:
      - "<消费的 operationId_1>"
      - "<消费的 operationId_2>"
    optional: false
    mock_strategy: "<Mock 开关配置说明>"

phase_context:
  spec:
    - "<spec 阶段需加载的文档路径>"
  plan:
    - "<plan 阶段需加载的文档路径>"
  build:
    - "<build 阶段需加载的文档路径>"
  test:
    - "<test 阶段需加载的文档路径>"
